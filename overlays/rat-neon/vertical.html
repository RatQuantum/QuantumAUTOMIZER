<!doctype html><html><head><meta charset="utf-8"><title>Rat Neon – Vertical 1080x1920</title>
<link rel="stylesheet" href="shared.css">
<style>html,body{width:1080px;height:1920px}</style></head><body>
<div class="stage">
  <!-- Header -->
  <div class="box" style="left:40px;top:60px;width:290px;height:280px"><div class="in">
    <div class="guide">RAT MASCOT<br>290×280</div></div></div>
  <div style="position:absolute;left:360px;top:90px;width:660px">
    <div class="live" style="font-size:30px"><i style="width:18px;height:18px"></i>LIVE NOW</div>
    <div class="title" style="font-size:96px;line-height:1;margin-top:14px">RAT</div>
    <div style="font:800 34px/1.2 Inter;margin-top:12px;color:var(--muted)">Road to Mythic • MLBB</div>
  </div>

  <!-- GAMEPLAY: put game capture at x0 y380, 1080x608 (16:9), BELOW this overlay -->
  <div class="frame" style="left:0;top:376px;width:1080px;height:616px;border-radius:14px"><div class="guide">GAMEPLAY 1080×608</div></div>

  <!-- Goal -->
  <div class="box" style="left:40px;top:1032px;width:880px;height:120px"><div class="in">
    <div class="guide">SUB GOAL widget</div></div><div class="tag">Goal</div></div>

  <!-- Chat + GPay -->
  <div class="box" style="left:40px;top:1192px;width:500px;height:420px"><div class="in">
    <div class="guide">CHAT BOX<br>here</div></div><div class="tag">Chat</div></div>
  <div class="box" style="left:568px;top:1192px;width:352px;height:420px"><div class="in"
    style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:18px">
    <div class="qr" data-qr="230"></div>
    <div class="payTxt"><b>Support the Rat 💜</b><span data-upi></span></div>
  </div><div class="tag">GPay</div></div>
  <!-- y 1640-1920 left empty on purpose: YouTube/TikTok put their buttons and chat there -->
</div>
<script src="qrcode.js"></script>
<script src="shared.js"></script></body></html>
