<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Day 3 (Tamil) · Kanha's 4 AM morning, 34.5s. Brand: saffron, gold, deep blue. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05070f;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="34.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- Picture scenes; the cuts sit under the fx layer -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0.0" data-duration="3.65" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="town" data-composition-id="town" data-composition-src="compositions/town.html" data-start="3.65" data-duration="3.55" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="bell" data-composition-id="bell" data-composition-src="compositions/bell.html" data-start="7.2" data-duration="2.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="suprabhatam" data-composition-id="suprabhatam" data-composition-src="compositions/suprabhatam.html" data-start="10.0" data-duration="3.1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="abhishekam" data-composition-id="abhishekam" data-composition-src="compositions/abhishekam.html" data-start="13.1" data-duration="3.0" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="alankaram" data-composition-id="alankaram" data-composition-src="compositions/alankaram.html" data-start="16.1" data-duration="3.15" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="aarti" data-composition-id="aarti" data-composition-src="compositions/aarti.html" data-start="19.25" data-duration="2.55" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="doors" data-composition-id="doors" data-composition-src="compositions/doors.html" data-start="21.8" data-duration="5.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="27.7" data-duration="6.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Light leaks and the aarti flash -->
      <div id="fx" data-composition-id="fx" data-composition-src="compositions/fx.html" data-start="0" data-duration="34.5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Every subtitle group -->
      <div id="subs" data-composition-id="subs" data-composition-src="compositions/subs.html" data-start="0" data-duration="34.5" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- Voiceover: ElevenLabs eleven_v4, Tamil voice "Aarumugam", one continuous take -->
      <audio id="vo-ta" class="clip" src="assets/vo/ta-full.wav" data-start="0.4" data-duration="31.04" data-volume="1" data-track-index="6"></audio>

      <!-- Sound effects: temple bell made with ElevenLabs (from Day 2); the rest bundled with media-use (Pixabay licence) -->
      <audio id="sfx-bell-open" class="clip" src="assets/sfx/temple-bell.mp3" data-start="0.0" data-duration="2.0" data-volume="0.3" data-track-index="7" data-fade-out="0.4"></audio>
      <audio id="sfx-bell-once" class="clip" src="assets/sfx/temple-bell.mp3" data-start="7.2" data-duration="2.0" data-volume="0.55" data-track-index="8" data-fade-out="0.4"></audio>
      <audio id="sfx-sparkle-alankaram" class="clip" src="assets/sfx/sparkle.mp3" data-start="16.0" data-duration="1.4" data-volume="0.1" data-track-index="9" data-fade-out="0.4"></audio>
      <audio id="sfx-whoosh-doors" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="21.55" data-duration="0.55" data-volume="0.28" data-track-index="8" data-fade-out="0.4"></audio>
      <audio id="sfx-chime-doors" class="clip" src="assets/sfx/chime.mp3" data-start="21.75" data-media-start="0.4" data-duration="2.1" data-volume="0.3" data-track-index="7" data-fade-out="0.4"></audio>
      <audio id="sfx-bell-cta" class="clip" src="assets/sfx/temple-bell.mp3" data-start="27.6" data-duration="2.0" data-volume="0.4" data-track-index="8" data-fade-out="0.4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
