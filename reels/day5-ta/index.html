<!doctype html>
<html lang="ta" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Day 5 (Tamil) · Krishna drives your chariot, 20.0s. Cinematic: dusk and crimson, then divine gold at 9.0s. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.0" data-width="1080" data-height="1920">
      <div id="shots" data-composition-id="shots" data-composition-src="compositions/shots.html" data-start="0" data-duration="20.0" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="fx" data-composition-id="fx" data-composition-src="compositions/fx.html" data-start="0" data-duration="20.0" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="texts" data-composition-id="texts" data-composition-src="compositions/texts.html" data-start="0" data-duration="20.0" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- Voices: ElevenLabs eleven_v4, "Bharadwaj" (narrator) and "Ramaa" (Krishna). Score and effects: ElevenLabs Music and Sound Effects. -->
      <audio id="a0" class="clip" src="assets/audio/score.wav" data-start="0.00" data-duration="20.00" data-volume="0.42" data-track-index="6"></audio>
      <audio id="a1" class="clip" src="assets/audio/vo-narrator.wav" data-start="0.40" data-duration="7.36" data-volume="1.0" data-track-index="7"></audio>
      <audio id="a2" class="clip" src="assets/audio/vo-krishna.wav" data-start="9.60" data-duration="8.08" data-volume="1.0" data-track-index="7"></audio>
      <audio id="a3" class="clip" src="assets/audio/wind.wav" data-start="0.00" data-duration="10.00" data-volume="0.3" data-track-index="8"></audio>
      <audio id="a4" class="clip" src="assets/audio/impact.wav" data-start="7.73" data-duration="3.00" data-volume="0.55" data-track-index="9"></audio>
      <audio id="a5" class="clip" src="assets/audio/chariot.wav" data-start="9.20" data-duration="4.00" data-volume="0.3" data-track-index="10"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
