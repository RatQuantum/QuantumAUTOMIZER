<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Day 1 · Shringar · generated devotional-art reel, 20s. Brand: saffron, gold, deep blue. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05070f;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <!-- Picture scenes, hard cuts hidden under the fx layer -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="garlands" data-composition-id="garlands" data-composition-src="compositions/garlands.html" data-start="3.3" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="jewels" data-composition-id="jewels" data-composition-src="compositions/jewels.html" data-start="7.7" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="peacock" data-composition-id="peacock" data-composition-src="compositions/peacock.html" data-start="10.9" data-duration="3.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="14.6" data-duration="5.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Light leaks and the flash cut, over every scene -->
      <div id="fx" data-composition-id="fx" data-composition-src="compositions/fx.html" data-start="0" data-duration="20" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Every subtitle group -->
      <div id="subs" data-composition-id="subs" data-composition-src="compositions/subs.html" data-start="0" data-duration="20" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- CTA (F): follow card -->
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="15.6" data-duration="4.4" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Voiceover: ElevenLabs, voice "Kiaan" -->
      <audio id="vo-garland" class="clip" src="assets/vo/line2-garland.mp3" data-start="3.5" data-duration="3.7" data-volume="1" data-track-index="6"></audio>
      <audio id="vo-cta" class="clip" src="assets/vo/line5-cta.mp3" data-start="15.8" data-duration="3.3" data-volume="1" data-track-index="6"></audio>

      <!-- Sound effects: temple bell (ElevenLabs), the rest bundled with media-use (Pixabay licence) -->
      <audio id="sfx-bell-open" class="clip" src="assets/sfx/temple-bell.mp3" data-start="0.15" data-duration="2" data-volume="0.55" data-track-index="7" data-fade-out="0.6"></audio>
      <audio id="sfx-sparkle-1" class="clip" src="assets/sfx/sparkle.mp3" data-start="3.05" data-duration="1.4" data-volume="0.3" data-track-index="8" data-fade-out="0.4"></audio>
      <audio id="sfx-chime-jewels" class="clip" src="assets/sfx/chime.mp3" data-start="7.7" data-media-start="0.4" data-duration="2.1" data-volume="0.35" data-track-index="7" data-fade-out="0.6"></audio>
      <audio id="sfx-whoosh-flash" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="10.65" data-duration="0.55" data-volume="0.3" data-track-index="8"></audio>
      <audio id="sfx-chime-peacock" class="clip" src="assets/sfx/chime.mp3" data-start="11.1" data-media-start="0.4" data-duration="2.1" data-volume="0.3" data-track-index="7" data-fade-out="0.6"></audio>
      <audio id="sfx-bell-reveal" class="clip" src="assets/sfx/temple-bell.mp3" data-start="14.55" data-duration="2" data-volume="0.6" data-track-index="8" data-fade-out="0.6"></audio>
      <audio id="sfx-sparkle-2" class="clip" src="assets/sfx/sparkle.mp3" data-start="14.3" data-duration="1.4" data-volume="0.25" data-track-index="9" data-fade-out="0.4"></audio>
      <audio id="sfx-click-follow" class="clip" src="assets/sfx/click-soft.mp3" data-start="17.6" data-duration="0.35" data-volume="0.5" data-track-index="7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
