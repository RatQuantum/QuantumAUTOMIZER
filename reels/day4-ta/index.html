<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Day 4 (Tamil) · why Kanha stole butter, 36.3s. Brand: saffron, gold, deep blue. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05070f;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="36.3"
      data-width="1080"
      data-height="1920"
    >
      <!-- Picture scenes; the cuts sit under the fx layer -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0.0" data-duration="5.05" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="uri" data-composition-id="uri" data-composition-src="compositions/uri.html" data-start="5.05" data-duration="6.63" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="monkeys" data-composition-id="monkeys" data-composition-src="compositions/monkeys.html" data-start="11.68" data-duration="5.32" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="question" data-composition-id="question" data-composition-src="compositions/question.html" data-start="17.0" data-duration="3.1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="churn" data-composition-id="churn" data-composition-src="compositions/churn.html" data-start="20.1" data-duration="3.0" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="heart" data-composition-id="heart" data-composition-src="compositions/heart.html" data-start="23.1" data-duration="5.35" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="28.45" data-duration="7.85" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Light leaks and the aarti flash -->
      <div id="fx" data-composition-id="fx" data-composition-src="compositions/fx.html" data-start="0" data-duration="36.3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Every subtitle group -->
      <div id="subs" data-composition-id="subs" data-composition-src="compositions/subs.html" data-start="0" data-duration="36.3" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- Voiceover: ElevenLabs eleven_v4, Tamil voice "Aarumugam", one continuous take -->
      <audio id="vo-ta" class="clip" src="assets/vo/ta-full.wav" data-start="0.4" data-duration="34.80" data-volume="1" data-track-index="6"></audio>

      <!-- Sound effects: temple bell made with ElevenLabs (Day 2); the rest bundled with media-use (Pixabay licence) -->
      <audio id="sfx-whoosh-open" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.05" data-duration="0.55" data-volume="0.25" data-track-index="8" data-fade-out="0.4"></audio>
      <audio id="sfx-sparkle-uri" class="clip" src="assets/sfx/sparkle.mp3" data-start="10.4" data-duration="1.4" data-volume="0.12" data-track-index="9" data-fade-out="0.4"></audio>
      <audio id="sfx-whoosh-question" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="16.75" data-duration="0.55" data-volume="0.22" data-track-index="8" data-fade-out="0.4"></audio>
      <audio id="sfx-chime-heart" class="clip" src="assets/sfx/chime.mp3" data-start="23.0" data-media-start="0.4" data-duration="2.1" data-volume="0.22" data-track-index="7" data-fade-out="0.4"></audio>
      <audio id="sfx-bell-cta" class="clip" src="assets/sfx/temple-bell.mp3" data-start="28.35" data-duration="2.0" data-volume="0.35" data-track-index="8" data-fade-out="0.4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
