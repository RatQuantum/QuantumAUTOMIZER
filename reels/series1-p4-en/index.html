<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Arjuna's Charioteer Part 4 (POV) */
      @font-face {
        font-family: "Nunito";
        src: url("assets/fonts/Nunito.ttf");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #7fb8e8;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      #gl {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      .ov {
        position: absolute;
        left: 40px;
        width: 1000px;
        text-align: center;
        font-family: "Nunito", sans-serif;
        font-weight: 900;
        color: #ffffff;
        -webkit-text-stroke: 10px #16121c;
        paint-order: stroke fill;
        text-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
      }
      #title {
        top: 150px;
        font-size: 104px;
        line-height: 1.02;
        color: #ffd23a;
      }
      #series {
        top: 1500px;
        font-size: 30px;
        letter-spacing: 3px;
        -webkit-text-stroke: 6px #16121c;
      }
      #cap {
        top: 1390px;
        font-size: 84px;
        line-height: 1.1;
      }
      #cap .y {
        color: #ffd23a;
      }
      #vig {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(10, 5, 30, 0.38) 100%);
      }
      #loc {
        top: 250px;
        left: 60px;
        width: 900px;
        text-align: left;
        font-size: 44px;
        -webkit-text-stroke: 8px #16121c;
      }
      #q {
        top: 360px;
        left: 640px;
        width: 300px;
        font-size: 220px;
        color: #ffd23a;
      }
      #cta {
        top: 330px;
        font-size: 92px;
        line-height: 1.05;
        color: #ffd23a;
      }
      #prog { position: absolute; top: 56px; left: 190px; width: 700px; display: flex; gap: 14px; }
      #prog .seg { flex: 1; text-align: center; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 26px; letter-spacing: 3px; color: #ffffff; -webkit-text-stroke: 5px #16121c; paint-order: stroke fill; }
      #prog .bar { height: 10px; margin-top: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.28); overflow: hidden; }
      #prog .bar i { display: block; height: 100%; width: 0%; background: #ffd23a; border-radius: 6px; }
      #pin { position: absolute; top: 1560px; left: 140px; width: 800px; padding: 18px 10px; border-radius: 40px; background: rgba(22, 18, 28, 0.78); border: 4px solid #ffd23a; text-align: center; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 40px; color: #ffffff; }
      #pin b { color: #ffd23a; }
      #follow { position: absolute; top: 1580px; left: 90px; width: 900px; padding: 16px 10px; border-radius: 36px; background: #ffd23a; text-align: center; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 38px; color: #16121c; letter-spacing: 1px; }
      #hud { position: absolute; top: 60px; left: 50px; font-family: "Nunito", sans-serif; font-weight: 900; z-index: 8; text-shadow: 0 3px 0 #16121c; }
      #hud .h1 { font-size: 36px; color: #ffffff; letter-spacing: 2px; } #hud .h2 { font-size: 32px; color: #f2c230; margin-top: 6px; }
      #recap { position: absolute; top: 190px; left: 50px; padding: 14px 30px; border-radius: 16px; background: #d8343a !important; color: #fff !important; font: 900 46px "Nunito" !important; z-index: 8; border: 5px solid #16121c; -webkit-text-stroke: 0 !important; }
      #cap { top: 1382px !important; }
      #chHead { color: #fff !important; } .choice { border: 6px solid #16121c !important; }
      #chA { background: #2f7ae5 !important; color: #fff !important; } #chB { background: #d8343a !important; color: #fff !important; }
      #chA b, #chB b { background: #fff !important; color: #16121c !important; }
      #prog, #title, #series, #pin, #follow { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="43.8" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="43.8" data-track-index="0" data-layout-ignore>
        <canvas id="gl" width="1080" height="1920"></canvas>
        <div id="hud"><div class="h1">KURUKSHETRA · DAY 14 · SUNSET</div><div class="h2">Arjuna's Charioteer · Part 4</div></div>
        <div id="vig"></div>
        <div id="loc" class="ov" style="opacity: 0"></div>
        <div id="title" class="ov">IT ALL GOES<br>WRONG</div>
        <div id="q" class="ov" style="opacity: 0">?</div>
        <div id="cap" class="ov"></div>
        <div id="prog"><div class="seg">STORY<div class="bar"><i></i></div></div><div class="seg">WHY<div class="bar"><i></i></div></div><div class="seg">TODAY<div class="bar"><i></i></div></div></div>
        <div id="pin" style="opacity: 0">💬 Comment <b>A</b> or <b>B</b>. You decide Part 5</div>
        <div id="follow" style="opacity: 0">FOLLOW · PART 5 TOMORROW</div>
        <div id="cta" class="ov" style="opacity: 0">Comment<br>“X” ⚔️</div>
      </div>
      <div id="series" class="clip ov" data-start="0" data-duration="5" data-track-index="1">WHY WE DO WHAT WE DO · #4</div>
      <audio id="vo" class="clip" src="assets/audio/voice.wav" data-start="0" data-duration="42.2" data-volume="1" data-track-index="2"></audio>
      <audio id="bed" class="clip" src="assets/audio/bed.wav" data-start="0" data-duration="43.8" data-volume="1" data-track-index="3"></audio>
    </div>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.scene = new Promise((res) => (window.__sceneReady = res));
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="assets/main.js"></script>
  </body>
</html>
