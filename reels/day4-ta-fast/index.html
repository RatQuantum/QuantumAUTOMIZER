<!doctype html>
<html lang="ta" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Day 4 (Tamil, fast cut) · why Kanha stole butter, 18.9s, 128 BPM. Brand: saffron, gold, deep blue. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05070f;
      }
      #root {
        width: 100%;
        height: 100%;
      }

    <div id="root" data-composition-id="main" data-start="0" data-duration="18.9" data-width="1080" data-height="1920">

      <!-- Music: ElevenLabs Music v2.5 (Hare Krishna mahamantra); conch: ElevenLabs Sound Effects; bell from Day 2 -->

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
