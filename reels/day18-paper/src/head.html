<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One leaf was enough</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  ONE LEAF WAS ENOUGH — Day 18 (cut paper) for @lordsrikrishnatemple. 9:16, voice-led (Chatterbox), 24fps.
//  Draupadi's akshaya patra (Mahabharata, Vana Parva): her pot is empty, Durvasa's ten thousand disciples are coming,
//  she calls Krishna, He eats one leaf stuck to the pot and every sage at the river feels full. Gita 9.26.
//  Format F5 (fixed-hero journey): Draupadi is the constant; hard cuts on the voice; the payoff (He came) lands in the
//  silence after her prayer. Reserved colour: the leaf's bright green (#7cc544) means "the little that is enough".
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = Math.round(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Kalam", "Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive';
const CX = 500;
const LEAF = '#7cc544', LEAFD = '#4f8f2a';

// voice cues: a line's start/end, and when a word starts (first match, n-th occurrence)
const VL = (id) => VOICE.lines.find((l) => l.id === id);
function VW(id, word, n = 1) {
  const L = VL(id); let k = 0;
  for (const w of L.words) if (w.w.toLowerCase().replace(/[^a-z']/g, '').startsWith(word.toLowerCase()) && ++k === n) return w.t0;
  return L.t0;
}
const fr = (t) => Math.round(t * FPS) / FPS;   // snap to a whole frame
// HOOK variants (strategy 7: test hooks, keep the body and CTA): A = the warning line over the dusk march (control),
// B = story-first (opens on the empty pot), C = emotion-first cold open (her whispered prayer, then the pot)
const HOOK = VOICE.hook || 'A';
const PRE = HOOK === 'C' ? VL('n2') : VL('d1');            // the line right before the silence and the payoff
const T = { came: fr(PRE.t1 + 0.45), leaf: fr(VW('n3', 'one')), full: fr(VW('n3', 'and') - 0.05), gita: fr(VL('k1').t0 - 0.25), end: fr(VL('n4').t0 - 0.2) };
let OPEN;
if (HOOK === 'A') { T.hut = fr(VL('n1').t1 + 0.25); T.pray = fr(VL('n2').t1 + 0.25); OPEN = [[0, T.hut, 'hook', () => sceneHook()], [T.hut, T.pray, 'pot', () => sceneEmptyPot()], [T.pray, T.came, 'pray', () => scenePrayer()]]; }
else if (HOOK === 'B') { T.hut = 0; T.pray = fr(VL('n2').t1 + 0.25); OPEN = [[0, T.pray, 'pot', () => sceneEmptyPot()], [T.pray, T.came, 'pray', () => scenePrayer()]]; }
else { T.pray = 0; T.hut = fr(VL('d1').t1 + 0.3); OPEN = [[0, T.hut, 'pray', () => scenePrayer()], [T.hut, T.came, 'pot', () => sceneEmptyPot()]]; }
const ERAS = [...OPEN,
  [T.came, T.leaf, 'came', () => sceneHeCame()],
  [T.leaf, T.full, 'leaf', () => sceneLeaf()],
  [T.full, T.gita, 'full', () => sceneFull()],
  [T.gita, T.end, 'gita', () => scenePromise()],
  [T.end, DURATION, 'end', () => sceneEnd()],
];
const ERA_LIST = ERAS.map(([a, b, , f]) => [a, b, f]);
const ERA_KEYS = ERAS.map(([, , k]) => k);
const SHOTS = ERAS.map(([a, b, k], i) => [k, i, a, b, k]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'journey',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: ERAS.slice(1).map(([a]) => a),
  morphs: [],
  cues: {
    sages: VW('n2', 'ten'), door: VW('n2', 'door'), please: VW('d1', 'please'), came: T.came,
    ate: VW('n3', 'ate'), full: VW('n3', 'full'),
    leaf: VW('k1', 'leaf'), flower: VW('k1', 'flower'), fruit: VW('k1', 'fruit'), water: VW('k1', 'water'), love: VW('k1', 'love'),
    enough: VW('n4', 'enough'), comment: VW('n5', 'comment'),
  },
  acts: [
    { name: '1 Nothing left', role: 'build', t0: 0, t1: PRE.t1 },
    { name: '2 Silence', role: 'silence', t0: PRE.t1, t1: T.came },
    { name: '3 He came', role: 'gift', t0: T.came, t1: T.gita },
    { name: '4 The promise', role: 'journey', t0: T.gita, t1: T.end },
    { name: '5 Enough', role: 'goodbye', t0: T.end, t1: DURATION },
  ],
  board: ERAS.map(([a0, b0, k]) => ({ t: (a0 + b0) / 2, title: k, sound: '', next: '' })),
  narration: VOICE.lines.map((l) => ({ t0: l.t0, t1: l.t1, text: l.text })),
  gridOffset: 0,
};
window.TIMELINE = TIMELINE;
